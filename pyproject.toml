[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "caspots"
# authors = [{ name = "Misbah Razzaq" }]
description = "Boolean network identification from time-series data."
requires-python = ">=3.9"
# license = { file = "LICENSE" }
version = "0.3"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/misbahch6/caspo-ts"

[project.optional-dependencies]
format = ["black", "isort"]
lint = ["pylint"]
typecheck = ["types-setuptools", "mypy"]
test = ["pytest", "coverage[toml]"]
dev = ["caspots[test,typecheck,lint]", "pre-commit", "nox"]

[project.scripts]
caspots = "caspots.console:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caspots = ["*.lp"]

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 10
max-attributes = 7
max-bool-expr = 5
max-branches = 12
max-locals = 30
max-parents = 7
max-public-methods = 20
max-returns = 10
max-statements = 50
min-public-methods = 1

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.pylint.basic]
argument-rgx = "^[a-z][a-z0-9]*((_[a-z0-9]+)*_?)?$"
variable-rgx = "^[a-z][a-z0-9]*((_[a-z0-9]+)*_?)?$"
good-names = ["_"]

[tool.coverage.run]
source = ["caspots", "tests"]
omit = ["*/caspots/__main__.py"]

[tool.coverage.report]
exclude_lines = ["assert", "nocoverage"]
